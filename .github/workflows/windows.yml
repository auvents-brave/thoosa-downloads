# Builds Thoosa for Windows — the only Windows build, the WinUI head — from
# the private application repository, here where Actions minutes are free.
#
# Manual only, and deliberately no pull_request trigger: the job holds a
# read-only token for the application's source (secret THOOSA_SOURCE_TOKEN,
# fine-grained, Contents + Actions read on ThoosaUno; BoatTools and Phorcys
# are public). The
# source never lands in this repository; the logs are public.
name: Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "ThoosaUno branch, tag or commit to build"
        default: main
      release:
        description: "Release tag to attach the archives to (empty: artefact only)"
        default: ""

permissions:
  contents: write

concurrency:
  group: windows
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          repository: auvents-brave/ThoosaUno
          ref: ${{ inputs.ref }}
          token: ${{ secrets.THOOSA_SOURCE_TOKEN }}
          path: ThoosaUno
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: "10.0.301" }

      # The bridges and their Swift runtime, built by the public "Bridge
      # Windows" workflows of BoatTools (SthenoBridge + BoatToolsBridge) and
      # of Phorcys (PhorcysBridge). Both artefacts carry the same Swift
      # runtime DLLs, built from the same release, so unpacking them into one
      # folder simply overwrites like with like.
      - name: Fetch the Windows bridges
        shell: bash
        working-directory: ThoosaUno
        env:
          GH_TOKEN: ${{ secrets.THOOSA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          fetch() {   # $1 repository   $2 artefact prefix   $3 a DLL to expect
            local run sha
            read -r run sha < <(gh run list --repo "auvents-brave/$1" --workflow bridge-windows.yml \
              --status success --limit 1 --json databaseId,headSha --jq '.[0] | "\(.databaseId) \(.headSha)"')
            test -n "${run:-}" || { echo "no successful Bridge Windows run on $1"; exit 1; }
            echo "Bridges from $1 ${sha:0:7} (run $run)" >> "$GITHUB_STEP_SUMMARY"
            for arch in x64 arm64; do
              gh run download "$run" --repo "auvents-brave/$1" \
                --name "$2-$arch" --dir "Native/win-$arch"
              test -f "Native/win-$arch/$3"
            done
          }
          fetch BoatTools bridges-windows BoatToolsBridge.dll
          fetch Phorcys phorcys-bridges-windows PhorcysBridge.dll

      # From the project directory with a relative path: Uno's resource
      # generator mislabels the languages' resources given an absolute one.
      # TargetFrameworks narrowed to Windows, or restore evaluates the Android
      # head too and demands its workload.
      - name: Publish
        shell: bash
        working-directory: ThoosaUno
        run: |
          set -euo pipefail
          # One architecture at a time, from clean intermediates: the first
          # publish's platform (x64) otherwise sticks to the second.
          # Trimming OFF: it removed System.Runtime, which the XAML type table
          # loads by name at startup — the app died before its first window —
          # and it would also break the bridges' reflection-based JSON.
          for arch in x64 arm64; do
            rm -rf Thoosa/bin Thoosa/obj
            dotnet publish Thoosa/Thoosa.csproj -f net10.0-windows10.0.26100 -r "win-$arch" -c Release \
              -p:TargetFrameworks=net10.0-windows10.0.26100 -p:Platform="$arch" -p:PlatformTarget="$arch" \
              -p:PublishTrimmed=false \
              --self-contained -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true \
              -p:SkipBridgeBuild=true -o "../stage/$arch/Thoosa"
            test -f "../stage/$arch/Thoosa/BoatToolsBridge.dll"
            test -f "../stage/$arch/Thoosa/PhorcysBridge.dll"
          done
          commit=$(git rev-parse HEAD)
          echo "$commit" > ../source-commit.txt
          echo "Thoosa from ThoosaUno ${commit:0:7}" >> "$GITHUB_STEP_SUMMARY"

      # Debug symbols are 42% of what we were shipping — 241 MB across six
      # files, most of them SkiaSharp's, ANGLE's and HarfBuzz's native .pdb
      # from their NuGet packages. Nobody debugs those here, and the app does
      # not read them. `DebugType` only governs our own assemblies, so the
      # third-party ones have to be swept at packaging time.
      - name: Archive
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'arm64') {
            $before = (Get-ChildItem "stage/$arch/Thoosa" -Recurse -File |
                       Measure-Object Length -Sum).Sum
            $pdb = Get-ChildItem "stage/$arch/Thoosa" -Recurse -Filter *.pdb
            $freed = ($pdb | Measure-Object Length -Sum).Sum
            $pdb | Remove-Item -Force
            $after = (Get-ChildItem "stage/$arch/Thoosa" -Recurse -File |
                      Measure-Object Length -Sum).Sum
            "$arch : dropped $($pdb.Count) .pdb, $([math]::Round($freed/1MB)) MB; " +
              "$([math]::Round($before/1MB)) MB -> $([math]::Round($after/1MB)) MB" |
              Tee-Object -Append "$env:GITHUB_STEP_SUMMARY"
            Compress-Archive -Path "stage/$arch/Thoosa" -DestinationPath "Thoosa-windows-$arch.zip"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: thoosa-windows
          path: |
            Thoosa-windows-*.zip
            source-commit.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the release
        if: inputs.release != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: gh release upload "$TAG" Thoosa-windows-x64.zip Thoosa-windows-arm64.zip --clobber --repo "$GITHUB_REPOSITORY"
